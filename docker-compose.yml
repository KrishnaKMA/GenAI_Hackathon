version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite + local factsheets persist
      - ./backend/models:/app/models  # ← Teammate A: mount your model files here
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# ─────────────────────────────────────────────────────────
# Run:
#   docker compose up --build
#   Open: http://localhost:5173
#   API:  http://localhost:8000/docs
# ─────────────────────────────────────────────────────────
