services:
  db2:
    image: ibmcom/db2
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=${DB2_PASSWORD:-ClaimShield123}
      - DBNAME=claimshield
      - BLU=false
      - ENABLE_ORACLE_COMPATIBILITY=false
      - TO_CREATE_SAMPLEDB=false
      - REPODB=false
      - UPDATEAVAIL=NO
      - IS_OSXFS=false
    volumes:
      - ./db2:/database
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite + local factsheets persist
      - ./backend/models:/app/models  # ← Teammate A: mount your model files here
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:5173
      - DB2_DSN=DATABASE=claimshield;HOSTNAME=db2;PORT=50000;PROTOCOL=TCPIP;UID=db2inst1;PWD=${DB2_PASSWORD:-ClaimShield123};
    depends_on:
      - db2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# ─────────────────────────────────────────────────────────
# Run:
#   docker compose up --build
#   Open: http://localhost:5173
#   API:  http://localhost:8000/docs
# ─────────────────────────────────────────────────────────
