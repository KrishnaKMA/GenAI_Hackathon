services:
  - type: web
    name: claimshield-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: claimshield-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_BACKEND
        value: sqlite
      - key: SQLITE_PATH
        value: /var/data/local.db
      - key: LOCAL_FACTSHEETS_PATH
        value: /var/data/local_factsheets.json
      - key: FORCE_MOCK_IBM
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false

  - type: static_site
    name: claimshield-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: claimshield-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
